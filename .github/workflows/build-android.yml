name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Ручной запуск

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # 4. Установить системные зависимости (часть 1 — базовые)
      - name: Install system dependencies (base)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg wget

      # 5. Установить системные зависимости (часть 2 — SDL и мультимедиа)
      - name: Install system dependencies (multimedia)
        run: |
          sudo apt-get install -y \
            python3-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev

      # 6. Установить GStreamer и JDK
      - name: Install system dependencies (GStreamer + JDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk

      # 7. Установить Android SDK (первый раз — долго, ~5-10 мин)
      - name: Setup Android SDK
        run: |
          buildozer android sdk

      # 8. Собрать APK
      - name: Build APK
        run: |
          buildozer android debug

      # 9. Загрузить APK как artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMonitor-APK
          path: bin/*.apk
          retention-days: 30
