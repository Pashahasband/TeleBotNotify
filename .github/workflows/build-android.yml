name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Ручной запуск

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # 4. Установить системные зависимости (часть 1 — базовые)
      - name: Install system dependencies (base)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg wget unzip

      # 5. Установить системные зависимости (часть 2 — SDL и мультимедиа)
      - name: Install system dependencies (multimedia)
        run: |
          sudo apt-get install -y \
            python3-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev

      # 6. Установить GStreamer и JDK
      - name: Install system dependencies (GStreamer + JDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk

      # 7. Принять лицензии Android SDK (buildozer сам скачает SDK)
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -n "d56f518d493fc9e98e880d950c27d8b0b930c044" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -n "84d6a5805b29c4faf0e9064f8ac21a958602e65b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
          echo -n "8933bad161af4178b1185d1a37fbf41ea526c4a" > ~/.buildozer/android/platform/android-sdk/licenses/source-sdk-license
          echo -n "fc99cb245008e0c449b130918ff11b1b8184d46d" > ~/.buildozer/android/platform/android-sdk/licenses/ndk-license
          echo "Licenses accepted"

      # 8. Собрать APK (buildozer сам скачает SDK и NDK, ~15-25 мин)
      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          
          # Запускаем buildozer — он скачает SDK и NDK
          # Если sdkmanager не найден в tools/bin/, создаём symlink
          buildozer android debug 2>&1 || {
            echo "Build failed, checking SDK structure..."
            ls -la $ANDROID_HOME/
            if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
              echo "Creating symlink tools -> cmdline-tools/latest"
              ln -sfn $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
              buildozer android debug
            else
              exit 1
            fi
          }
        timeout-minutes: 60

      # 9. Загрузить APK как artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMonitor-APK
          path: bin/*.apk
          retention-days: 30
