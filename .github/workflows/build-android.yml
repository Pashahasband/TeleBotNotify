name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Ручной запуск

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (требуется для Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # 5. Установить системные зависимости
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg wget unzip \
            python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libunwind-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      # 6. Принять лицензии Android SDK
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          echo "8933bad161af4178b1185d1a37fbf41ea526c4a" > ~/.android/repositories.cfg
          
          # Создаём директорию для SDK
          export ANDROID_HOME=$HOME/.android/android-sdk-linux
          mkdir -p $ANDROID_HOME

      # 7. Скачать и установить Android SDK
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/.android/android-sdk-linux
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Скачиваем command-line-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O sdk.zip
          
          # Распаковываем
          python3 $GITHUB_WORKSPACE/.github/scripts/extract_sdk.py
          
          # Перемещаем cmdline-tools в нужное место
          mv /tmp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          # Создаём symlink tools -> cmdline-tools/latest для buildozer
          ln -sfn $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          
          # Проверяем и даём права
          chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          ls -la $ANDROID_HOME/tools/bin/sdkmanager
          
          # Устанавливаем необходимые компоненты
          $ANDROID_HOME/tools/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"
          
          # Создаём symlink для NDK
          mkdir -p $HOME/.buildozer/android/platform
          ln -sfn $ANDROID_HOME/ndk/25.2.9519653 $HOME/.buildozer/android/platform/android-ndk-r25b
          
          echo "SDK installed successfully"
          ls -la $ANDROID_HOME/

      # 8. Собрать APK
      - name: Build APK
        env:
          ANDROID_HOME: $HOME/.android/android-sdk-linux
          ANDROID_SDK_ROOT: $HOME/.android/android-sdk-linux
        run: |
          export ANDROID_HOME=$HOME/.android/android-sdk-linux
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          echo "SDK location: $ANDROID_HOME"
          ls -la $ANDROID_HOME/tools/bin/sdkmanager
          
          buildozer android debug
        timeout-minutes: 60

      # 9. Загрузить APK как artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMonitor-APK
          path: bin/*.apk
          retention-days: 30
