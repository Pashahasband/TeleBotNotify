name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.cargo
            ~/.rustup
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**', 'scripts/setup_p4a.py') }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential cmake gettext git \
            libffi-dev libltdl-dev libncurses-dev libssl-dev libtool \
            pkg-config unzip wget zip zlib1g-dev
          python -m pip install \
            "buildozer==1.6.0" "Cython==0.29.34" "setuptools<81"
          rustup toolchain install stable --profile minimal

      - name: Build debug APK
        run: scripts/build_android.sh

      - name: Verify artifact
        run: |
          unzip -t bin/*.apk
          sha256sum bin/*.apk | tee bin/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMonitor-APK
          path: |
            bin/*.apk
            bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
