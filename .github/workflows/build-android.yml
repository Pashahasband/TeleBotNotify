name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Ручной запуск

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # 4. Установить системные зависимости (часть 1 — базовые)
      - name: Install system dependencies (base)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg wget unzip

      # 5. Установить системные зависимости (часть 2 — SDL и мультимедиа)
      - name: Install system dependencies (multimedia)
        run: |
          sudo apt-get install -y \
            python3-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev

      # 6. Установить GStreamer и JDK
      - name: Install system dependencies (GStreamer + JDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk

      # 7. Установить Android SDK tools и принять лицензии
      - name: Setup Android SDK
        run: |
          # Создаём структуру buildozer SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          
          # Скачиваем и распаковываем command-line-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11704137_latest.zip -O tools.zip
          mkdir -p /tmp/unzip_tmp
          unzip -oq tools.zip -d /tmp/unzip_tmp
          mv /tmp/unzip_tmp/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # Создаём директорию licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Создаём файлы лицензий
          echo -n "d56f518d493fc9e98e880d950c27d8b0b930c044" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -n "84d6a5805b29c4faf0e9064f8ac21a958602e65b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
          echo -n "8933bad161af4178b1185d1a37fbf41ea526c4a" > ~/.buildozer/android/platform/android-sdk/licenses/source-sdk-license
          echo -n "fc99cb245008e0c449b130918ff11b1b8184d46d" > ~/.buildozer/android/platform/android-sdk/licenses/ndk-license
          
          # Устанавливаем build-tools через sdkmanager
          export PATH=$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$PATH
          sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;34.0.0" "platform-tools" "platforms;android-34"
          
          echo "SDK setup complete"
          ls ~/.buildozer/android/platform/android-sdk/

      # 8. Собрать APK (buildozer сам скачает NDK, ~15-25 мин)
      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          buildozer android debug
        timeout-minutes: 60

      # 9. Загрузить APK как artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMonitor-APK
          path: bin/*.apk
          retention-days: 30
